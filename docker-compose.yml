version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: arthentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arthentic
      POSTGRES_PASSWORD: arthentic_dev_password
      POSTGRES_DB: arthentic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthentic -d arthentic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arthentic-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: arthentic-anvil
    restart: unless-stopped
    working_dir: /workspace/contracts
    volumes:
      - ./contracts:/workspace/contracts
    entrypoint:
      - /bin/sh
      - -c
      - |
        anvil --host 0.0.0.0 --port 8545 --chain-id 84532 &
        ANVIL_PID=$$!
        sleep 2
        forge script script/Deploy.s.sol:DeployArthentic --rpc-url http://127.0.0.1:8545 --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 --broadcast || true
        wait $$ANVIL_PID
    ports:
      - "8545:8545"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arthentic-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://arthentic:arthentic_dev_password@postgres:5432/arthentic_db
      REDIS_URL: redis://redis:6379/0
      BASE_RPC_URL: http://anvil:8545
      ETH_L1_RPC_URL: http://anvil:8545
      BASE_CHAIN_ID: "84532"
      ETH_L1_CHAIN_ID: "11155111"
      JWT_SECRET_KEY: arthentic-staging-secret-key-at-least-32-chars-long!
      KMS_PROVIDER: local_enclave
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
